name: Deploy KAL Radar web to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['Web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: kalradar-web-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for existing branch-based Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const endpoint='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs?head_sha='+process.env.GITHUB_SHA+'&per_page=20';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          for(let attempt=0;attempt<24;attempt++){
            const response=await fetch(endpoint,{headers});
            if(!response.ok)throw Error('Cannot read deployment status: HTTP '+response.status);
            const runs=(await response.json()).workflow_runs;
            const legacy=runs.find(run=>run.path==='dynamic/pages/pages-build-deployment');
            if(legacy?.status==='completed'||(!legacy&&attempt>=2))break;
            if(attempt===23)throw Error('Existing Pages deployment is still running');
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          console.log('Existing branch deployment finished; publish the web frontend last');
          JS
      - uses: actions/configure-pages@v5
      - name: Build static frontend
        run: node Web/scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
