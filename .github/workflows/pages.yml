name: Deploy KAL Radar web to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['Web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Build static frontend
        run: node Web/scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
